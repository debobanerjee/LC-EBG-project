<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">Two paths, one evidence-based evaluation</title><desc id="desc">RAG retrieves selected chunks. Long-context reading retains the document context. Both generate answers and citations for joint evaluation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4z" fill="#7894a0"/></marker></defs><g font-family="Arial,sans-serif"><g fill="none" stroke="#7894a0" stroke-width="2" marker-end="url(#arrow)"><path d="M173 165H211V88H251"/><path d="M211 165V234H251"/><path d="M528 88H565V165H604"/><path d="M528 234H565V165"/><path d="M785 165H825"/></g><rect x="22" y="103" width="151" height="124" rx="12" fill="#f2f5f7" stroke="#d5e0e5"/><g fill="white" stroke="#6b8997" stroke-width="2"><rect x="52" y="125" width="55" height="67" rx="3"/><rect x="63" y="134" width="55" height="67" rx="3"/><rect x="74" y="143" width="55" height="67" rx="3"/><path d="M83 157h35m-35 10h35m-35 10h26m-26 10h31"/></g><text x="97" y="255" fill="#4d626b" text-anchor="middle" font-size="17">Document corpus</text><rect x="251" y="29" width="277" height="119" rx="12" fill="#faf2ef" stroke="#ddc7bd"/><text x="275" y="60" fill="#a4654f" font-size="14" font-weight="bold">RAG</text><text x="275" y="89" fill="#363636" font-size="20">Retrieve top-k chunks</text><text x="275" y="121" fill="#777" font-size="14">Are all required facts available?</text><rect x="251" y="175" width="277" height="119" rx="12" fill="#eef5f8" stroke="#c6dce6"/><text x="275" y="207" fill="#427c91" font-size="14" font-weight="bold">LONG CONTEXT</text><text x="275" y="236" fill="#363636" font-size="20">Read document context</text><text x="275" y="268" fill="#777" font-size="14">Can the reader cite the evidence?</text><rect x="604" y="103" width="181" height="124" rx="12" fill="#f2f7f4" stroke="#bfd4c8"/><text x="694" y="135" text-anchor="middle" fill="#386f58" font-size="14" font-weight="bold">EBG OUTPUT</text><text x="694" y="168" text-anchor="middle" fill="#363636" font-size="20">Answer</text><text x="694" y="198" text-anchor="middle" fill="#363636" font-size="17">+ line citations</text><rect x="825" y="103" width="153" height="124" rx="12" fill="#fff" stroke="#cbd7dd"/><text x="901" y="139" text-anchor="middle" fill="#617b88" font-size="17">Ans</text><text x="901" y="168" text-anchor="middle" fill="#617b88" font-size="17">Evid</text><text x="901" y="201" text-anchor="middle" fill="#386f58" font-size="18" font-weight="bold">Ans+Evid</text></g></svg>